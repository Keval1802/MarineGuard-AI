name: MarineGuard AI Complete System Harness

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-harness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Full System Harness
        env:
          PYTHONPATH: backend
          HARNESS_USE_REAL_ASSETS: "True"
          HARNESS_MOCK_LLM: "True"
        run: |
          python harness_cli.py --mode=all

      - name: Run Pytest Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests/
