name: MarineGuard AI Scheduled Monitor & CI

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test-and-scan:
    name: Backend Tests & Monitoring Scan
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT || 'keval8532@gmail.com' }}
      CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
      CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ensure Storage Directory Exists
        run: |
          mkdir -p backend/storage/evidence

      - name: Build RAG Index
        run: |
          python scripts/build_rag_index.py

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests/

      - name: Execute Monitoring Scan & Dispatch Alert Email
        run: |
          python -c "import asyncio, sys; sys.path.insert(0, 'backend'); from app.database import SessionLocal, Base, engine; Base.metadata.create_all(bind=engine); from app.api.monitoring import run_monitoring_cycle; db = SessionLocal(); res = asyncio.run(run_monitoring_cycle(latitude=21.145, longitude=72.620, db=db, current_user={'role': 'admin'})); print('Scan Completed & Alert Email Dispatched:', res)"

      - name: Upload Evidence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-artifacts
          path: backend/storage/evidence/
          retention-days: 7

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Type Check & Production Build
        working-directory: ./frontend
        run: npm run build
