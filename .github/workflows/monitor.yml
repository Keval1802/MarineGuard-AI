name: MarineGuard AI Scheduled Monitor & CI

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test-and-scan:
    name: Backend Tests & Monitoring Scan
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ensure Storage Directory Exists
        run: |
          mkdir -p backend/storage/evidence

      - name: Build RAG Index
        run: |
          python scripts/build_rag_index.py

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests/

      - name: Run Demo Incident Seeding & Validation
        run: |
          python scripts/seed_demo_incident.py

      - name: Upload Evidence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-artifacts
          path: backend/storage/evidence/
          retention-days: 7

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Type Check & Production Build
        working-directory: ./frontend
        run: npm run build
